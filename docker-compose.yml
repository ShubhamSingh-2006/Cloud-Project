services:
  app1:
    build: .
    environment:
      INSTANCE_ID: app-instance-1

  app2:
    build: .
    environment:
      INSTANCE_ID: app-instance-2

  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
